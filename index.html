<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>星粒銀行 | Star Bank</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#303540;background:#f6f7f9}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #e8e9ed;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800;letter-spacing:.04em}.star{color:#c99839}.tag{font-size:11px;color:#8b744c;background:#fff6e4;padding:6px 9px;border-radius:20px}main{max-width:520px;margin:auto;padding:24px 17px 50px}.card{background:white;border:1px solid #e8e9ed;border-radius:22px;padding:23px;margin-bottom:18px;box-shadow:0 4px 18px #24304a08}.eyebrow{font-size:13px;color:#7c8490;font-weight:700}.balance{font-size:43px;font-weight:800;letter-spacing:-.04em;margin:15px 0 7px}.coin{display:inline-grid;place-items:center;width:39px;height:39px;border-radius:50%;vertical-align:4px;font-size:23px;color:#fff;background:linear-gradient(140deg,#f6d78b,#c8963c);border:3px solid #f9e9c2;box-shadow:inset 0 0 0 1px #b8852e}.sub{font-size:12px;color:#8b929e}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:23px}.action{border:0;border-radius:13px;padding:14px 10px;font-weight:750;font-size:15px;background:#fff5df;color:#956a1e}.action.secondary{background:#f1f3f6;color:#455160}.section{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}.section h2{font-size:16px;margin:0}.section span{font-size:12px;color:#8c949f}.empty{text-align:center;padding:22px 4px;color:#8c929b;font-size:13px}.illustration{height:115px;position:relative;display:flex;justify-content:center;align-items:end;gap:8px;margin-bottom:14px}.boy{position:relative;width:58px;height:85px}.boy .head{position:absolute;top:0;left:11px;width:39px;height:39px;background:#343a42;border-radius:48% 48% 47% 47%}.boy .hair{position:absolute;top:-5px;left:26px;width:13px;height:12px;border-left:4px solid #343a42;transform:rotate(35deg);border-radius:50%}.boy .body{position:absolute;bottom:0;left:4px;width:53px;height:47px;background:#343a42;border-radius:21px 21px 8px 8px}.boy .zig{position:absolute;top:47px;left:20px;color:#e6c67e;font-weight:900;font-size:23px;letter-spacing:-6px;transform:rotate(-5deg)}.cat-svg{display:block;width:58px;height:67px;flex:none;overflow:visible}.tiny-star{position:absolute;top:9px;right:27%;font-size:24px;color:#d4a34b}.ground{width:150px;height:2px;background:#e5e6e8;margin:-2px auto 0}.notice{font-size:12px;color:#7c8592;text-align:center;line-height:1.8}.history{list-style:none;margin:0;padding:0}.history li{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eff0f2;padding:14px 0;font-size:14px}.history small{display:block;color:#969ca5;margin-top:4px}.history strong{white-space:nowrap}.foot{text-align:center;font-size:12px;color:#a0a6ae;margin-top:25px}.modal{position:fixed;inset:0;background:#17202d70;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.dialog{background:#fff;border-radius:20px;padding:24px;width:min(100%,400px)}.dialog h2{font-size:19px;margin:0 0 12px}.dialog p{font-size:13px;line-height:1.7;color:#69717d}.dialog button{width:100%;padding:12px;background:#f2f3f5;border:0;border-radius:12px;margin-top:8px;font-size:15px}button{cursor:pointer}
</style>
</head>
<body>
<header><div class="brand"><span class="star">✦</span> 星粒銀行</div><div class="tag">STAR BANK</div></header>
<main>
<section class="card"><div class="eyebrow">保有星粒</div><div class="balance"><span class="coin">★</span> <span id="balance">0</span> <span style="font-size:18px">粒</span></div><div class="sub">あなたの星粒残高</div><div class="actions"><button class="action" onclick="info('チャージ')">＋ チャージ</button><button class="action secondary" onclick="info('使用')">✧ 星粒を使う</button></div></section>
<div class="section"><h2>星粒の履歴</h2><span>最近の取引</span></div><section class="card"><ul id="history" class="history"></ul><div id="empty" class="empty"><div class="illustration" aria-hidden="true"><span class="tiny-star">✦</span><div class="boy"><div class="hair"></div><div class="head"></div><div class="body"></div><div class="zig">⌁⌁</div></div><svg class="cat-svg" viewBox="0 0 58 67" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="#343a42"><path d="M42 48 C54 45 54 32 50 25 C47 19 51 17 54 21 C63 34 57 54 43 57 Z"/><path d="M14 42 C14 32 21 28 29 28 C39 28 45 35 45 47 L45 65 L13 65 Z"/><path d="M9 23 L11 3 Q12 0 15 4 L23 12 Q29 10 35 12 L43 4 Q46 0 47 4 L49 23 Q49 42 29 42 Q9 42 9 23 Z"/></g></svg></div><div class="ground"></div><p>まだ取引履歴はないよ。<br>星粒が動いたら、ここに表示されるよ ✨</p></div></section>
<p class="notice">✦ ただいま画面確認用の試作版です。<br>実際の残高・取引はまだ保存されません。</p><div class="foot">Star Bank · Preview 0.1</div>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="dialog"><h2 id="modalTitle"></h2><p>この機能は次の開発段階で、Firebaseのログインとデータ保存に接続するよ。今は操作の見た目だけ確認してね。</p><button onclick="document.getElementById('modal').classList.remove('show')">閉じる</button></div></div>
<script>function info(name){document.getElementById('modalTitle').textContent=name+'（準備中）';document.getElementById('modal').classList.add('show')}</script>
</body></html>
