
<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星粒銀行・シルエット試着室 第3案</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f7f5f0;
  color:#394052;
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",sans-serif;
}
main{
  max-width:650px;
  margin:auto;
  padding:24px 16px 50px;
}
h1{
  font-size:21px;
  margin:0 0 8px;
}
p{
  color:#7c8492;
  font-size:13px;
  line-height:1.8;
}
.panel{
  background:white;
  border-radius:22px;
  padding:18px;
  margin-top:20px;
  box-shadow:0 5px 22px #26304712;
}
h2{
  font-size:14px;
  margin:8px 0 12px;
}
.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:18px;
}
button{
  background:white;
  border:1px solid #dedfe5;
  border-radius:12px;
  padding:11px 13px;
  color:#677082;
  font-size:12px;
  font-weight:bold;
}
button.active{
  background:#fff0ca;
  color:#8c672a;
  border-color:#cfa966;
}
.stage{
  position:relative;
  width:100%;
  height:320px;
  overflow:hidden;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .3s;
}
.stage.home{
  background:linear-gradient(160deg,
    #ffe9b7,#fff9e9);
}
.stage.lala{
  background:linear-gradient(160deg,
    #ffe3a1,#fff6d8);
}
.stage.moon{
  background:linear-gradient(160deg,
    #18213c,#435580);
}
.stars{
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(circle at 16% 18%,
      #f5d48c 0 2px,transparent 3px),
    radial-gradient(circle at 77% 25%,
      #f5d48c 0 1.5px,transparent 3px),
    radial-gradient(circle at 62% 12%,
      #f5d48c 0 2px,transparent 3px),
    radial-gradient(circle at 88% 68%,
      #f5d48c 0 1px,transparent 3px);
}
.moon .stars{
  opacity:.85;
}
.silhouette{
  position:relative;
  z-index:1;
  display:block;
  max-width:none;
  object-fit:contain;
  filter:none;
  transition:
    width .2s,
    filter .2s;
}
.stage.home .silhouette{
  width:85%;
}
.stage.lala .silhouette{
  width:80%;
}
.stage.moon .silhouette{
  width:94%;
}
.stage.light .silhouette{
  filter:brightness(0) invert(1);
}
.caption{
  margin-top:14px;
  text-align:center;
  font-size:13px;
  color:#7d8593;
}
.range{
  width:100%;
  accent-color:#cda359;
}
.range-label{
  display:flex;
  justify-content:space-between;
  color:#7d8593;
  font-size:12px;
  margin:12px 0 5px;
}
.note{
  margin-top:18px;
  padding:14px;
  background:#faf7ef;
  border-radius:13px;
  font-size:12px;
  line-height:1.9;
  color:#747c8a;
}
</style>
</head>
<body>
<main>

<h1>✦ 星粒銀行・シルエット試着室</h1>
<p>
第3案。今回はSVGで描き直さず、
アップロードしたPNG画像をそのまま表示するよ。
</p>

<section class="panel">

<h2>表示する場所</h2>
<div class="buttons">
  <button class="scene-btn active" data-scene="home">
    ホーム
  </button>
  <button class="scene-btn" data-scene="lala">
    LaLa預金
  </button>
  <button class="scene-btn" data-scene="moon">
    月見里返済
  </button>
</div>

<div id="stage" class="stage home">
  <div class="stars"></div>

  <img
    id="silhouette"
    class="silhouette"
    src="./7F86A3FD-DBEE-4C0B-8064-56D36F3D2443.png"
    alt="男の子と黒猫のシルエット"
  >
</div>

<div id="caption" class="caption">
  ホーム用シルエット
</div>

<h2 style="margin-top:22px">シルエットの色</h2>
<div class="buttons">
  <button id="darkBtn" class="active">
    元の黒色
  </button>
  <button id="lightBtn">
    明るい色で表示
  </button>
</div>

<div class="range-label">
  <span>画像の大きさ</span>
  <span id="sizeText">100%</span>
</div>
<input
  id="size"
  class="range"
  type="range"
  min="50"
  max="150"
  value="100"
>

<div class="note">
  ✦ 画像はアップロードしたものをそのまま使用。<br>
  ✦ 大きさはスライダーで調整できるよ。<br>
  ✦ 明るい色は夜空での見え方を試すためのもの。<br>
  ✦ 星粒銀行本体のデータには影響しないよ。
</div>

</section>
</main>

<script>
const images={
  home:{
    src:"./7F86A3FD-DBEE-4C0B-8064-56D36F3D2443.png",
    title:"ホーム用シルエット",
    width:85
  },
  lala:{
    src:"./84C20629-6473-4327-A6FA-8A9436F8A036.png",
    title:"LaLa預金用シルエット",
    width:80
  },
  moon:{
    src:"./69BD7493-904A-43A1-9F1E-E143989AC4F8.png",
    title:"月見里返済用シルエット",
    width:94
  }
};

const stage=document.getElementById("stage");
const img=document.getElementById("silhouette");
const caption=document.getElementById("caption");
const slider=document.getElementById("size");
const sizeText=document.getElementById("sizeText");
const darkBtn=document.getElementById("darkBtn");
const lightBtn=document.getElementById("lightBtn");

let current="home";

function updateSize(){
  const base=images[current].width;
  const scale=Number(slider.value)/100;
  img.style.width=(base*scale)+"%";
  sizeText.textContent=slider.value+"%";
}

document.querySelectorAll(".scene-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    current=btn.dataset.scene;
    stage.className="stage "+current;
    img.src=images[current].src;
    caption.textContent=images[current].title;

    document.querySelectorAll(".scene-btn").forEach(b=>{
      b.classList.toggle("active",b===btn);
    });

    darkBtn.classList.add("active");
    lightBtn.classList.remove("active");

    slider.value=100;
    updateSize();
  });
});

darkBtn.addEventListener("click",()=>{
  stage.classList.remove("light");
  darkBtn.classList.add("active");
  lightBtn.classList.remove("active");
});

lightBtn.addEventListener("click",()=>{
  stage.classList.add("light");
  lightBtn.classList.add("active");
  darkBtn.classList.remove("active");
});

slider.addEventListener("input",updateSize);
updateSize();
</script>
</body>
</html>
