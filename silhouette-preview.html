
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff5dd">
<title>星粒銀行・シルエット試着室 2</title>

<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  color:#363c49;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:#f7f5f0;
}
main{
  max-width:640px;
  margin:auto;
  padding:24px 16px 60px;
}
h1{
  font-size:21px;
  margin:0 0 10px;
}
p{
  color:#818895;
  font-size:13px;
  line-height:1.8;
}
.panel{
  background:white;
  border:1px solid #e9e8e5;
  border-radius:22px;
  padding:18px;
  margin-top:18px;
  box-shadow:0 5px 22px #2630470a;
}
.heading{
  font-size:13px;
  font-weight:800;
  margin:15px 0 9px;
}
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
button{
  border:1px solid #dedfe5;
  background:white;
  color:#626b7a;
  border-radius:12px;
  padding:11px 13px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
button.active{
  border-color:#cba35f;
  background:#fff0cc;
  color:#916824;
}
.stage{
  margin-top:19px;
  border-radius:20px;
  min-height:290px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  position:relative;
  transition:background .5s;
}
.stage.day{
  background:
    radial-gradient(ellipse at 50% 85%,#ffe9a8,transparent 72%),
    linear-gradient(160deg,#fff0c9,#fffbf2);
}
.stage.night{
  background:
    radial-gradient(ellipse at 80% 10%,#43557f,transparent 55%),
    linear-gradient(165deg,#17213d,#3d4f79);
}
.stage svg{
  display:block;
  width:100%;
  max-width:500px;
  height:auto;
  overflow:visible;
}
.stage .scene{display:none}
.stage .scene.active{display:block}

/* 実際のシルエットの色 */
.boy-shape{fill:#343746}
.cat-shape{fill:#242835}
.curl{
  fill:none;
  stroke:#343746;
  stroke-width:8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.curl-fine{
  fill:none;
  stroke:#343746;
  stroke-width:5.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.garment{
  fill:none;
  stroke:#f2d48f;
  stroke-width:5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.floor{
  stroke:#bda67b;
  stroke-width:2.5;
  fill:none;
  stroke-linecap:round;
}
.night .floor{stroke:#899ac3}
.spark{fill:#d5a657}
.night .spark{fill:#d6dfff}
.stage .cutout{
  fill:none;
  stroke:#fff2d2;
  stroke-width:3;
  stroke-linecap:round;
}
.night .cutout{
  stroke:#34476c;
}

.caption{
  text-align:center;
  font-size:13px;
  font-weight:750;
  color:#717a89;
  margin:17px 0 3px;
}
.description{
  font-size:12px;
  color:#939aa5;
  text-align:center;
  line-height:1.7;
}
.note{
  margin-top:18px;
  background:#faf7ef;
  border-radius:13px;
  padding:14px;
  color:#777f8b;
  font-size:12px;
  line-height:1.9;
}
</style>
</head>

<body>
<main>

<h1>✦ 星粒銀行・シルエット試着室</h1>
<p>
第2案。角ばった形を減らして、
丸い頭・くるくる前髪・しなやかな黒猫を
重点的に描き直したよ。
</p>

  <div class="heading">ポーズを選ぶ</div>

  <div class="controls">

      ぺしょっと寝そべる

    <button class="pose" data-pose="sit">
      並んで座る

    <button class="pose" data-pose="close">
      寄り添って座る

  </div>

  <div class="heading">背景を選ぶ</div>

  <div class="controls">
    <button class="color active" data-color="day">
      ✦ LaLa・黄色
    </button>
    <button class="color" data-color="night">
      ☾ 月見里・紺色
    </button>
  </div>

  <div id="stage" class="stage day">

    <!-- ─────────────────────

  <div id="caption" class="caption">

<div class="note">
  ✦ これは画像生成ではなく、
  Webページで実際に表示するSVGだよ。
  背景の切り替えも、3種類のポーズも
  星粒銀行本体のデータには影響しないよ。
</div>

</main>

<script>
const stage=document.getElementById('stage');
const caption=document.getElementById('caption');
const description=document.getElementById('description');

const captions={
  flat:'ぺしょっと寝そべるふたり',
  sit:'並んで座るふたり',
  close:'寄り添って座るふたり'
};

const descriptions={
  flat:'床の高さから見る、低い構図。頭と猫の輪郭を丸くした第2案。',
  sit:'横に並んだ、のんびりした後ろ姿。大きな頭と小さな身体。',
  close:'男の子が少し猫に寄りかかった、静かな構図。'
};

document.querySelectorAll('.pose').forEach(button=>{
  button.addEventListener('click',()=>{
    const pose=button.dataset.pose;

    document.querySelectorAll('.pose').forEach(b=>{
      b.classList.toggle('active',b===button);
    });

    document.querySelectorAll('.scene').forEach(svg=>{
      svg.classList.toggle('active',svg.id===pose);
    });

    caption.textContent=captions[pose];
    description.textContent=descriptions[pose];
  });
});

document.querySelectorAll('.color').forEach(button=>{
  button.addEventListener('click',()=>{
    const color=button.dataset.color;

    document.querySelectorAll('.color').forEach(b=>{
      b.classList.toggle('active',b===button);
    });

    stage.className='stage '+color;
  });
});
</script>

</body>
</html>
